spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
server.port=${PORT:8080}
server.address=0.0.0.0
server.servlet.context-path=/
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Per-instance safeguards for high-risk unauthenticated and payment endpoints.
# Use a distributed limiter when running multiple backend instances.
security.rate-limit.auth-per-minute=${AUTH_RATE_LIMIT_PER_MINUTE:10}
security.rate-limit.payment-per-minute=${PAYMENT_RATE_LIMIT_PER_MINUTE:30}
app.audit.retention-days=${AUDIT_RETENTION_DAYS:730}
app.audit.cleanup-cron=${AUDIT_CLEANUP_CRON:0 20 3 * * *}

# Google Maps address autocomplete/geocoding
google.maps.enabled=${GOOGLE_MAPS_ENABLED:false}
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
logging.level.root=WARN
logging.level.org.example.duwaz=INFO

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Email (Gmail SMTP - SSL on port 465)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Resend API key (overrides SMTP for OTP emails)
resend.api.key=${RESEND_API_KEY:}

# Africa's Talking SMS
africastalking.username=${AT_USERNAME:sandbox}
africastalking.api.key=${AT_API_KEY:}

# Yoco Payment Gateway
yoco.secret.key=${YOCO_SECRET_KEY:}
yoco.webhook.secret=${YOCO_WEBHOOK_SECRET:}
app.frontend.url=${FRONTEND_URL:https://duwaz.co.za}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://duwaz.co.za,https://www.duwaz.co.za}

# Sentry Error Tracking
sentry.dsn=${SENTRY_DSN:}
app.environment=${APP_ENVIRONMENT:development}

# Logging
logging.level.io.sentry=INFO
logging.level.io.sentry.spring=DEBUG
