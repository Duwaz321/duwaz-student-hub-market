spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/duwaz}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
server.port=8080
server.servlet.context-path=/
server.tomcat.threads.max=10
server.tomcat.threads.min-spare=2
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Google Maps address autocomplete/geocoding
google.maps.enabled=${GOOGLE_MAPS_ENABLED:false}
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}
logging.level.root=WARN
logging.level.org.example.duwaz=INFO

# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email (Gmail SMTP - SSL on port 465)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:465}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Resend API key (overrides SMTP for OTP emails)
resend.api.key=${RESEND_API_KEY:}

# Africa's Talking SMS
africastalking.username=${AT_USERNAME:sandbox}
africastalking.api.key=${AT_API_KEY:}

# Yoco Payment Gateway
yoco.secret.key=${YOCO_SECRET_KEY:}
app.frontend.url=${FRONTEND_URL:https://duwaz.co.za}

# Sentry Error Tracking
sentry.dsn=${SENTRY_DSN:}
app.environment=${APP_ENVIRONMENT:development}

# Logging
logging.level.io.sentry=INFO
logging.level.io.sentry.spring=DEBUG
