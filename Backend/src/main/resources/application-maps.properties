# ============================================================================
# Google Maps API Configuration
# ============================================================================
# 
# To enable Google Maps integration:
# 1. Get API key from Google Cloud Console (https://console.cloud.google.com/)
# 2. Enable these APIs in your project:
#    - Geocoding API
#    - Places API (for autocomplete)
#    - Distance Matrix API (optional, for accurate travel time)
#    - Maps JavaScript API
# 3. Set the API key below
# 4. Add spring.profiles.active=maps to your main application.properties or pass as env var

# Enable Google Maps services
google.maps.enabled=false

# Google Maps API Key - get from Google Cloud Console
# This key should have restrictions:
# - Application restrictions: None (or restrict to server IP)
# - API restrictions: Geocoding API, Places API, Distance Matrix API
google.maps.api.key=${GOOGLE_MAPS_API_KEY:}

# Session tokens for Places Autocomplete (recommended for billing optimization)
google.maps.session.tokens.enabled=true

# Geofence settings - CPUT Campus (Cape Peninsula University of Technology)
# CPUT Zonnebloem Campus: -33.9636, 18.4133
# CPUT City Campus: -33.9250, 18.4167
google.maps.delivery.radius.km=5
google.maps.nearby.stores.radius.km=2
google.maps.campus.latitude=-33.9636
google.maps.campus.longitude=18.4133

# API rate limiting (to avoid quota issues)
google.maps.rate.limit.enabled=true
google.maps.rate.limit.requests.per.minute=100

# Caching geocoding results (reduces API calls)
google.maps.geocoding.cache.enabled=true
google.maps.geocoding.cache.ttl.hours=24

# Fallback autocomplete bias location (used when API is disabled)
# When Google Maps API is not enabled, autocomplete suggestions are biased to CPUT campus area
google.maps.fallback.bias.latitude=-33.9636
google.maps.fallback.bias.longitude=18.4133
google.maps.fallback.bias.radius.km=5
